[package]
name = "tangle_bench"
version.workspace = true
edition.workspace = true
authors.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Benchmark suite for the Tangle relay"

[[bin]]
name = "tangle-benchmark-report"
path = "src/bin/tangle_benchmark_report.rs"

[dependencies]
pocket-types = { git = "https://github.com/triesap/pocket", rev = "329334f20948c796c6016b673b92551ac4855ad7" }
serde_json = "1"
sha2 = "0.10"
tangle_groups = { path = "../tangle_groups" }
tangle_protocol = { path = "../tangle_protocol" }
tangle_runtime = { path = "../tangle_runtime" }
tangle_store_pocket = { path = "../tangle_store_pocket" }
tangle_test_support = { path = "../tangle_test_support" }
tokio = { version = "1", features = ["rt"] }

[lints]
workspace = true
